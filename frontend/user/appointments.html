<!DOCTYPE html>
<html lang="en" data-locale-base="/locales">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="appointments_title">My appointments</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body class="min-h-screen bg-[#f6f8fb] text-slate-800 flex flex-col">
    <header class="public-header">
      <a href="/user/" data-history-back class="public-back-button btn-secondary" data-i18n="btn_back">Volver</a>
      <nav class="public-nav"><a href="/user/" data-i18n="nav_home">Inicio</a><a href="/user/schedule.html" data-i18n="nav_schedule">Agendar cita</a><a href="/user/vehicles.html" class="current" data-i18n="nav_garage">Mi garaje</a></nav>
      <div class="flex items-center gap-2"><div data-auth-ui class="flex items-center gap-2"></div></div>
    </header>

    <div id="announcement-banner" class="hidden"></div>

    <main class="page-main flex-1">
      <section id="login-required" class="card w-full max-w-md text-center hidden">
        <h1 class="text-2xl font-bold mb-3" data-i18n="garage_login_required">Sign in to open your garage</h1>
        <p class="text-slate-500 mb-6" data-i18n="garage_login_hint">Sign in or create an account to manage your appointments, vehicles and repairs.</p>
        <button id="btn-open-login" type="button" class="btn-primary" data-i18n="client_login">Sign in</button>
      </section>

      <section id="appointments-content" class="page-wrap max-w-3xl hidden">
        <div class="page-heading"><div><p class="public-kicker" data-i18n="appointments_kicker">Tu agenda</p><h1 data-i18n="appointments_title">Mis citas</h1><p data-i18n="appointments_intro">Revisa próximas visitas y el estado de cada reserva.</p></div></div>
        <div id="appointments-list" class="space-y-3"></div>
        <div id="appointments-empty" class="hidden text-center py-6">
          <p class="text-slate-500 mb-4" data-i18n="appointments_empty">Aún no tienes citas</p>
          <a href="/user/schedule.html" class="btn-primary" data-i18n="appointments_book">Agendar cita</a>
        </div>
      </section>
    </main>

    <footer class="public-footer text-center">&copy; <span data-site-year></span> <span data-site-name></span></footer>

    <script src="/shared/i18n.js?v=5"></script>
    <script src="/shared/api.js?v=6"></script>
    <script src="/shared/auth.js?v=6"></script>
    <script src="/user/app.js?v=5"></script>
    <script>window.PAGE = "appointments";</script>
  </body>
</html>
