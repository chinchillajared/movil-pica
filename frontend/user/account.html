<!DOCTYPE html>
<html lang="es" data-locale-base="/locales">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="account_info">Mi cuenta | Mecánico en Cóbano</title>
    <meta name="description" content="Administra tu cuenta, vehículos y citas de mecánico a domicilio en Cóbano, Santa Teresa y alrededores." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0b1628" />
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body class="app-shell flex min-h-screen flex-col">
    <header class="public-header">
      <a href="/user/" data-history-back class="public-back-button btn-secondary" data-i18n="btn_back">Volver</a>
      <nav class="public-nav" aria-label="Navegación principal">
        <a href="/user/" data-i18n="nav_home">Inicio</a>
        <a href="/user/schedule.html" data-i18n="nav_schedule">Agendar cita</a>
        <a href="/user/vehicles.html" data-i18n="nav_garage">Mi garaje</a>
      </nav>
      <div data-auth-ui class="flex items-center gap-2"></div>
    </header>

    <div id="announcement-banner" class="hidden"></div>

    <main class="public-main flex-1">
      <section id="login-required" class="page-main flex items-center justify-center">
        <div class="page-card w-full max-w-md text-center">
          <p class="public-kicker" data-i18n="account_kicker">Tu espacio personal</p>
          <h1 class="mt-2 text-2xl font-black text-[#0b1628]" data-i18n="garage_login_required">Inicia sesión para abrir tu garaje</h1>
          <p class="mt-3 text-sm leading-6 text-slate-500" data-i18n="garage_login_hint">Inicia sesión o crea una cuenta para gestionar tus citas, vehículos y servicios.</p>
          <button id="btn-open-login" type="button" class="btn-primary mt-6" data-i18n="client_login">Iniciar sesión</button>
        </div>
      </section>

      <section id="account-content" class="page-main hidden">
        <div class="account-wrap">
          <div class="account-intro">
            <div>
              <p class="public-kicker text-[#c7f36a]" data-i18n="account_kicker">Tu espacio personal</p>
              <h1 data-i18n="account_info">Información de mi cuenta</h1>
              <p><span data-i18n="account_welcome">Bienvenido</span>, <strong id="account-client-name"></strong>.</p>
            </div>
          </div>

          <div class="account-choice-grid">
            <div class="rounded-2xl border border-slate-200 bg-[#f6f8fb] p-6">
              <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-bold text-slate-500" data-i18n="label_first_name">Nombre</span>
                  <span id="account-info-first" class="text-sm font-medium text-[#0b1628]"></span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-sm font-bold text-slate-500" data-i18n="label_last_name">Apellido</span>
                  <span id="account-info-last" class="text-sm font-medium text-[#0b1628]"></span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-sm font-bold text-slate-500" data-i18n="label_phone">Teléfono</span>
                  <span id="account-info-phone" class="text-sm font-medium text-[#0b1628]"></span>
                </div>
                <div id="account-info-email-row" class="hidden flex items-center justify-between">
                  <span class="text-sm font-bold text-slate-500" data-i18n="client_email">Email</span>
                  <span id="account-info-email" class="text-sm font-medium text-[#0b1628]"></span>
                </div>
                <button id="btn-edit-account" type="button" class="btn-secondary w-full" data-i18n="client_edit">Editar cuenta</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="public-footer text-center">&copy; <span data-site-year></span> <span data-site-name></span></footer>

    <script src="/shared/i18n.js?v=5"></script>
    <script src="/shared/api.js?v=6"></script>
    <script src="/shared/auth.js?v=6"></script>
    <script src="/user/app.js?v=5"></script>
    <script>window.PAGE = "account";</script>
  </body>
</html>
