<!DOCTYPE html>
<html lang="en" data-locale-base="/locales">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="vehicles_title">My vehicles</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-white">
      <div class="flex items-center gap-3">
        <img data-site-logo alt="" class="hidden h-8 w-auto" />
        <a href="/user/" class="btn-secondary" data-i18n="btn_back">Back</a>
      </div>
      <div class="flex items-center gap-2">
        <div data-auth-ui class="flex items-center gap-2"></div>
      </div>
    </header>

    <div id="announcement-banner" class="hidden"></div>

    <main class="flex-1 p-6 flex items-start justify-center">
      <section id="login-required" class="card w-full max-w-md text-center hidden">
        <h1 class="text-2xl font-bold mb-3" data-i18n="vehicles_login_required">Sign in to manage your vehicles</h1>
        <p class="text-slate-500 mb-6" data-i18n="vehicles_login_hint">Inicia sesión para registrar y ver tus vehículos.</p>
        <button id="btn-open-login" type="button" class="btn-primary" data-i18n="client_login">Sign in</button>
      </section>

      <section id="vehicles-content" class="w-full max-w-3xl hidden">
        <h1 class="text-2xl font-bold mb-6" data-i18n="vehicles_title">My vehicles</h1>
        <div id="vehicles-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      </section>
    </main>

    <script src="/shared/i18n.js?v=5"></script>
    <script src="/shared/api.js?v=5"></script>
    <script src="/shared/auth.js?v=5"></script>
    <script src="/user/app.js?v=5"></script>
    <script>window.PAGE = "vehicles";</script>
  </body>
</html>
