<!DOCTYPE html>
<html lang="en" data-locale-base="/locales">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="repairs_title">Repairs</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body class="app-shell flex flex-col">
    <header class="app-header">
      <div class="flex items-center gap-3">
        <img data-site-logo alt="" class="hidden h-10 w-auto" />
        <a href="/user/garage.html" class="btn-secondary" data-i18n="btn_back">Back</a>
      </div>
      <div class="flex items-center gap-2">
        <div data-auth-ui class="flex items-center gap-2"></div>
      </div>
    </header>

    <div id="announcement-banner" class="hidden"></div>

    <main class="flex-1 p-6 flex items-start justify-center">
      <section id="login-required" class="card w-full max-w-md text-center hidden">
        <h1 class="text-2xl font-bold mb-3" data-i18n="garage_login_required">Sign in to open your garage</h1>
        <p class="text-slate-500 mb-6" data-i18n="garage_login_hint">Sign in or create an account to manage your appointments, vehicles and repairs.</p>
        <button id="btn-open-login" type="button" class="btn-primary" data-i18n="client_login">Sign in</button>
      </section>

      <section id="repairs-content" class="hidden w-full max-w-4xl">
        <div class="mb-6">
          <h1 id="repairs-title" class="text-2xl font-bold text-slate-900" data-i18n="repairs_title">Services</h1>
          <p class="mt-1 text-sm text-slate-500">Consulta los trabajos realizados y el detalle de cada servicio.</p>
        </div>
        <div id="vehicle-tags" class="mb-6 hidden"></div>
        <div id="repairs-list" class="space-y-3"></div>
        <p id="repairs-empty" class="hidden text-center text-slate-500 py-6" data-i18n="repairs_empty">No services registered for your vehicles yet.</p>
      </section>
    </main>

    <script src="/shared/i18n.js?v=5"></script>
    <script src="/shared/api.js?v=6"></script>
    <script src="/shared/auth.js?v=6"></script>
    <script src="/user/app.js?v=5"></script>
    <script>window.PAGE = "repairs";</script>
  </body>
</html>
