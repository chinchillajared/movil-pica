<!DOCTYPE html>
<html lang="en" data-locale-base="/locales">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app_name">Mobile Mechanic</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body class="app-shell flex flex-col">
    <header class="app-header">
      <div class="flex items-center gap-3">
        <img data-site-logo alt="" class="hidden h-10 w-auto" />
        <div>
          <h1 class="text-xl font-bold text-slate-900" data-i18n="app_name">Mobile Mechanic</h1>
          <p class="text-sm text-slate-500" data-i18n="tagline">Book your appointment in minutes</p>
        </div>
      </div>
      <nav class="flex items-center gap-3">
        <div data-auth-ui class="flex items-center gap-2"></div>
      </nav>
    </header>

    <div id="announcement-banner" class="hidden"></div>

    <main class="flex-1 flex items-center justify-center p-6">
      <div class="grid w-full max-w-3xl grid-cols-1 gap-4 sm:grid-cols-3">
        <a href="/user/schedule.html" class="btn-square sm:flex-col sm:items-start">
          <img class="icon w-14 h-14" src="/icons/calendar.svg" alt="" />
          <span class="text-lg" data-i18n="btn_schedule">Schedule an appointment</span>
        </a>
        <a href="/user/status.html" class="btn-square sm:flex-col sm:items-start">
          <img class="icon w-14 h-14" src="/icons/magnifying_glass.svg" alt="" />
          <span class="text-lg" data-i18n="btn_status">Check appointment status</span>
        </a>
        <a href="/user/garage.html" class="btn-square sm:flex-col sm:items-start">
          <img class="icon w-14 h-14" src="/icons/garage.svg" alt="" />
          <span class="text-lg" data-i18n="btn_vehicles">My garage</span>
        </a>
      </div>
    </main>

    <footer class="px-6 py-3 text-center text-xs text-slate-400">
      &copy; <span id="year"></span>
    </footer>

    <script src="/shared/i18n.js?v=5"></script>
    <script src="/shared/api.js?v=6"></script>
    <script src="/shared/auth.js?v=6"></script>
    <script src="/user/app.js?v=5"></script>
    <script>window.PAGE = "home";</script>
  </body>
</html>
