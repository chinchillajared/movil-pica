<!DOCTYPE html>
<html lang="en" data-locale-base="/locales">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app_name">Mobile Mechanic</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-white">
      <div class="flex items-center gap-3">
        <img src="/images/logo.jpg" alt="" class="h-10 w-auto" />
        <div>
          <h1 class="text-xl font-bold text-slate-900" data-i18n="app_name">Mobile Mechanic</h1>
          <p class="text-sm text-slate-500" data-i18n="tagline">Book your appointment in minutes</p>
        </div>
      </div>
      <nav class="flex items-center gap-3">
        <div data-auth-ui class="flex items-center gap-2"></div>
      </nav>
    </header>

    <div id="announcement-banner" class="hidden"></div>

    <main class="flex-1 flex items-center justify-center p-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 w-full max-w-3xl justify-items-center">
        <a href="/user/schedule.html" class="btn-square">
          <span class="icon" aria-hidden="true">&#128197;</span>
          <span class="text-lg" data-i18n="btn_schedule">Schedule an appointment</span>
        </a>
        <a href="/user/status.html" class="btn-square">
          <span class="icon" aria-hidden="true">&#128269;</span>
          <span class="text-lg" data-i18n="btn_status">Check appointment status</span>
        </a>
      </div>
    </main>

    <footer class="px-6 py-3 text-center text-xs text-slate-400">
      &copy; <span id="year"></span>
    </footer>

    <script src="/shared/i18n.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/user/app.js"></script>
    <script>window.PAGE = "home";</script>
  </body>
</html>
