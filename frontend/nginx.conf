server {
    listen 80;
    server_name _;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
    gzip_min_length 1024;

    location ~* \.(js|css|html|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /mechanic {
        return 302 /mechanic/;
    }

    location = / {
        try_files /index.html =404;
    }

    # Keep the homepage on one canonical URL instead of serving duplicate /user aliases.
    location = /user {
        return 301 /;
    }

    location = /user/ {
        return 301 /;
    }

    location = /user/index.html {
        return 301 /;
    }

    location /mechanic/ {
        try_files $uri $uri/ /mechanic/dashboard.html;
    }

    location / {
        try_files $uri /user/index.html;
    }

    error_page 404 /user/index.html;
}
