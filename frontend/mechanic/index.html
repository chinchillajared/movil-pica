<!DOCTYPE html>
<html lang="en" data-locale-base="/locales">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="mechanic_login">Mechanic access</title>
    <link rel="stylesheet" href="/shared/styles.css" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
    <header class="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-white">
      <div class="flex items-center gap-3">
        <img src="/images/logo.png" alt="" class="h-8 w-auto" />
        <a href="/user/" class="text-sm text-slate-500 hover:text-slate-800" data-i18n="nav_home">Home</a>
      </div>
      <div data-lang-switcher class="flex items-center gap-1"></div>
    </header>

    <main class="flex-1 p-6 flex items-center justify-center">
      <form id="login-form" class="card w-full max-w-sm hidden">
        <h1 class="text-2xl font-bold mb-1" data-i18n="mechanic_login">Mechanic access</h1>
        <p class="text-slate-500 mb-6 text-sm" data-i18n="mechanic_panel">Mechanic panel</p>

        <label class="field-label" for="login-email" data-i18n="client_email">Email</label>
        <input id="login-email" name="email" type="email" required class="field-input mb-4" autocomplete="email" />

        <label class="field-label" for="login-password" data-i18n="mechanic_password">Password</label>
        <input id="login-password" name="password" type="password" required class="field-input mb-4" autocomplete="current-password" />

        <div id="form-error" class="hidden mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm p-3"></div>

        <button type="submit" class="btn-primary w-full" data-i18n="mechanic_login_btn">Sign in</button>
      </form>

      <form id="setup-form" class="card w-full max-w-sm hidden">
        <h1 class="text-2xl font-bold mb-1" data-i18n="mechanic_setup_title">Set up your admin</h1>
        <p class="text-slate-500 mb-6 text-sm" data-i18n="mechanic_setup_subtitle">Create the main administrator account.</p>

        <label class="field-label" for="setup-name" data-i18n="users_name">Name</label>
        <input id="setup-name" name="name" type="text" required class="field-input mb-4" autocomplete="name" />

        <label class="field-label" for="setup-email" data-i18n="client_email">Email</label>
        <input id="setup-email" name="email" type="email" required class="field-input mb-4" autocomplete="email" />

        <label class="field-label" for="setup-password" data-i18n="mechanic_password">Password</label>
        <input id="setup-password" name="password" type="password" required class="field-input mb-4" autocomplete="new-password" minlength="8" />

        <div id="setup-error" class="hidden mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm p-3"></div>

        <button type="submit" class="btn-primary w-full" data-i18n="mechanic_setup_btn">Create admin</button>
      </form>
    </main>

    <script src="/shared/i18n.js?v=5"></script>
    <script src="/shared/api.js?v=5"></script>
    <script src="/mechanic/app.js?v=5"></script>
    <script>window.PAGE = "login";</script>
  </body>
</html>
