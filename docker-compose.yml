services:
  db:
    image: postgres:16-alpine
    container_name: mechanic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - mechanic_net

  pgadmin:
    image: dpage/pgadmin4:9.1
    container_name: mechanic_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is required in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required in .env}
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mechanic_net

  backend:
    build: ./backend
    container_name: mechanic_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required in .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required in .env}
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-}
      EMAILAPP_PASSWORD: ${EMAILAPP_PASSWORD:-}
      SITE_URL: ${SITE_URL:?SITE_URL is required in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required in .env}:8000"
    networks:
      - mechanic_net

  frontend:
    build:
      context: ./frontend
      args:
        SITE_URL: ${SITE_URL:-http://localhost:8081}
    container_name: mechanic_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is required in .env}:80"
    depends_on:
      - backend
    networks:
      - mechanic_net

networks:
  mechanic_net:
    driver: bridge

volumes:
  pgdata:
  pgadmin_data:
